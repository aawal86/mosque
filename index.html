<style>

function load(){
  let s=localStorage.getItem(KEY);
  try{records=s?JSON.parse(s):[...defaultData];}catch(e){records=[...defaultData];}
  if(!localStorage.getItem('payment_cleaned_v2')){
    records=records.filter(r=>(parseFloat(r.amount)||0)>0);
    localStorage.setItem(KEY,JSON.stringify(records));
    localStorage.setItem('payment_cleaned_v2','1');
  }
  if(!localStorage.getItem('payment_added_2021')){
    if(!records.some(r=>/-21$/.test(r.month))){records=[...early2021,...records];}
    localStorage.setItem(KEY,JSON.stringify(records));
    localStorage.setItem('payment_added_2021','1');
  }
  sortRecords();
}
function sortRecords(){
  const MN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const dt=r=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(r.date||'').trim());return m?Date.UTC(+m[3],+m[2]-1,+m[1]):Infinity;};
  const mk=r=>{const m=/^([A-Za-z]{3})-(\d{2})$/.exec(String(r.month||'').trim());const i=m?MN.indexOf(m[1].toLowerCase()):-1;return m&&i>=0?(2000+ +m[2])*12+i:Infinity;};
  records.sort((a,b)=>{const p=mk(a),q=mk(b);if(p!==q)return p<q?-1:1;const x=dt(a),y=dt(b);return x===y?0:(x<y?-1:1);});
}
function save(){localStorage.setItem(KEY,JSON.stringify(records));toast(t('saved'));}
function render(){
  const tb=document.getElementById('tableBody');tb.innerHTML='';
  let sum=0,count=0,last='-';
  if(!records.length){tb.innerHTML='<tr class="er"><td colspan="5"><div class="empty">'+t('empty')+'</div></td></tr>';}
  records.forEach((r,i)=>{
    const a=parseFloat(r.amount)||0;sum+=a;
    if(a>0){count++;last=r.month||'-';}
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="n">${i+1}</td>
    <td class="c-date" data-label="${t('th_date')}"><input value="${esc(r.date)}" aria-label="Payment date" onchange="upd(${i},'date',this.value)"></td>
    <td class="c-month" data-label="${t('th_month')}"><input value="${esc(r.month)}" aria-label="Month" onchange="upd(${i},'month',this.value)"></td>
    <td class="c-amt" data-label="${t('th_amt')}"><input class="amt" type="number" step="any" value="${r.amount}" aria-label="Amount" onchange="upd(${i},'amount',this.value)"></td>
    <td class="no-print c-del"><button class="del" title="Delete row" onclick="del(${i})"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-1 12a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7m5 4v6m4-6v6M9 7V4h6v3M4 7h16"/></svg></button></td>`;
    tb.appendChild(tr);
  });
  const f=nf(sum);
  document.getElementById('totalAmount').textContent=f;
  document.getElementById('sumTotal').textContent=f;
  document.getElementById('sumCount').textContent=nf(count);
  document.getElementById('sumLast').textContent=last;
}
function upd(i,k,v){records[i][k]=k==='amount'?(v===''?0:parseFloat(v)):v;sortRecords();save();render();}
function addRow(){records.push({month:t('newmonth'),amount:0,date:""});save();render();const w=document.querySelector('.tbl-wrap');w.scrollTo({top:w.scrollHeight,behavior:'smooth'});}
function del(i){records.splice(i,1);save();render();}
function exportBackup(){
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(records,null,2));
  a.download='Al_Nur_Jame_Mosque_payments_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();toast(t('backed'));
}
function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){records=d;sortRecords();save();render();toast(t('restored'));}else alert(t('bad'));}catch(x){alert(t('unread'));}e.target.value='';};
  rd.readAsText(f);
}
let tt;
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.style.display='flex';clearTimeout(tt);tt=setTimeout(hideToast,2500);}
function hideToast(){document.getElementById('toast').style.display='none';}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
</script>
</body>
</html>
