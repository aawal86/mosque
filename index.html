<style>

.list{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}

.row{width:100%;text-align:left;padding-top:14px;padding-bottom:14px;border:0;border-top:1px solid var(--line);background:#fff;cursor:pointer;transition:background .15s}
.row:hover{background:#f2f9f6}
.row .m{font-weight:600}.row .d{color:var(--mut);font-size:13.5px}

.db{padding:10px 22px;display:grid;gap:12px}

.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}

 .row .m{grid-area:m}.row .d{grid-area:d}.row .a{grid-area:a;font-size:16px}.row .c{grid-area:c}}

</style>

<body>

    <label class="ib" data-t="restore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M16 8l-4-4-4 4M12 4v11"/></svg><span data-i="restore"></span><input type="file" accept=".json" hidden onchange="importBackup(event)"></label>
    <button class="ib" data-t="print" onclick="window.print()"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v6H7z"/></svg><span data-i="print"></span></button>

</div>

    <div><label data-i="th_date" for="fD"></label><input type="date" id="fD"></div>

  </div>
  <div class="df"><button class="gh dl" id="dDel" onclick="delEdit()" data-i="del"></button><button class="gh" onclick="dlg.close()" data-i="cancel"></button><button class="btn" onclick="saveEdit()" data-i="save"></button></div>
</dialog>
<div id="toast"></div>
<script>
const early2021=[{month:"Jan-21",amount:500,date:"31/01/2021"},{month:"Feb-21",amount:500,date:"28/02/2021"},{month:"Mar-21",amount:500,date:"31/03/2021"},{month:"Apr-21",amount:500,date:"30/04/2021"},{month:"May-21",amount:500,date:"31/05/2021"},{month:"Jun-21",amount:500,date:"30/06/2021"},{month:"Jul-21",amount:500,date:"31/07/2021"},{month:"Aug-21",amount:500,date:"31/08/2021"},{month:"Sep-21",amount:500,date:"30/09/2021"},{month:"Oct-21",amount:500,date:"31/10/2021"},{month:"Nov-21",amount:500,date:"30/11/2021"},{month:"Dec-21",amount:500,date:"31/12/2021"}];
const defaultData=[...early2021,{month:"Jan-23",amount:500,date:"28/01/2023"},{month:"Feb-23",amount:500,date:"28/02/2023"},{month:"Mar-23",amount:500,date:"28/03/2023"},{month:"Apr-23",amount:500,date:"28/04/2023"},{month:"May-23",amount:500,date:"28/05/2023"},{month:"Jun-23",amount:500,date:"28/06/2023"},{month:"Jul-23",amount:500,date:"31/07/2023"},{month:"Aug-23",amount:500,date:"31/08/2023"},{month:"Sep-23",amount:500,date:"30/09/2023"},{month:"Oct-23",amount:500,date:"31/10/2023"},{month:"Nov-23",amount:500,date:"30/11/2023"},{month:"Dec-23",amount:500,date:"31/12/2023"},{month:"Jan-24",amount:500,date:"19/03/2024"},{month:"Feb-24",amount:500,date:"19/03/2024"},{month:"Mar-24",amount:500,date:"19/03/2024"},{month:"Apr-24",amount:500,date:"04/04/2024"},{month:"May-24",amount:500,date:"10/06/2024"},{month:"Jun-24",amount:500,date:"10/06/2024"},{month:"Jul-24",amount:500,date:"10/06/2024"},{month:"Aug-24",amount:1000,date:"02/08/2024"},{month:"Sep-24",amount:1000,date:"19/09/2024"},{month:"Oct-24",amount:1000,date:"20/12/2024"},{month:"Nov-24",amount:1000,date:"20/12/2024"},{month:"Dec-24",amount:1000,date:"20/12/2024"},{month:"Jan-25",amount:1000,date:"20/01/2025"},{month:"Feb-25",amount:1000,date:"04/02/2025"},{month:"Mar-25",amount:1000,date:"23/03/2025"},{month:"Apr-25",amount:1000,date:"04/05/2025"},{month:"May-25",amount:1000,date:"04/05/2025"},{month:"Jun-25",amount:1000,date:"07/08/2025"},{month:"Jul-25",amount:1000,date:"07/08/2025"},{month:"Aug-25",amount:1000,date:"07/08/2025"},{month:"Sep-25",amount:1000,date:"07/08/2025"},{month:"Oct-25",amount:1000,date:"10/12/2025"},{month:"Nov-25",amount:1000,date:"10/12/2025"},{month:"Dec-25",amount:1000,date:"10/12/2025"},{month:"Jan-26",amount:1000,date:"17/04/2026"},{month:"Feb-26",amount:1000,date:"17/04/2026"},{month:"Mar-26",amount:1000,date:"17/04/2026"},{month:"Apr-26",amount:1000,date:"17/04/2026"},{month:"May-26",amount:1000,date:"17/04/2026"},{month:"Jun-26",amount:1000,date:"17/04/2026"},{month:"Jul-26",amount:1000,date:"04/10/2026"},{month:"Aug-26",amount:1000,date:"04/10/2026"},{month:"Sep-26",amount:1000,date:"04/10/2026"},{month:"Oct-26",amount:1000,date:"04/10/2026"}];
const KEY='payment_records_data',MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T={en:{name:'Al Nur Jame Mosque',monthly:'Monthly Payment',addr:'Hazi Chan Miah Maler Bari, South Raipur, Raipur, Lakshmipur, Bangladesh (ZIP: 3710)',total_paid:'Total paid',months_paid:'Months paid',latest:'Latest month',add:'Add payment',backup:'Backup',restore:'Restore',print:'Print',th_month:'Month',year:'Year',th_date:'Payment date',th_amt:'Amount',total:'Total',all:'All',months:'months',tip:'Tap any payment to edit it. Changes save automatically in this browser.',empty:'No payments here yet.',edit:'Edit payment',new:'New payment',save:'Save',del:'Delete',cancel:'Cancel',confirm:'Delete this payment?',saved:'Saved.',backed:'Backup downloaded.',restored:'Backup restored.',bad:'Invalid backup file.',unread:'Could not read the backup file.',need:'Enter an amount.',lang:'বাংলা',mn:['January','February','March','April','May','June','July','August','September','October','November','December']},
bn:{name:'আল নূর জামে মসজিদ',monthly:'মাসিক পেমেন্ট',addr:'হাজী চান মিয়া মালের বাড়ি, দক্ষিণ রায়পুর, রায়পুর, লক্ষ্মীপুর, বাংলাদেশ (জিপ: ৩৭১০)',total_paid:'মোট জমা',months_paid:'পরিশোধিত মাস',latest:'সর্বশেষ মাস',add:'পেমেন্ট যোগ করুন',backup:'ব্যাকআপ',restore:'রিস্টোর',print:'প্রিন্ট',th_month:'মাস',year:'বছর',th_date:'পেমেন্টের তারিখ',th_amt:'পরিমাণ',total:'মোট',all:'সব',months:'মাস',tip:'এডিট করতে যেকোনো পেমেন্টে ট্যাপ করুন। পরিবর্তন স্বয়ংক্রিয়ভাবে এই ব্রাউজারে সেভ হয়।',empty:'এখানে এখনো কোনো পেমেন্ট নেই।',edit:'পেমেন্ট এডিট',new:'নতুন পেমেন্ট',save:'সেভ করুন',del:'মুছুন',cancel:'বাতিল',confirm:'এই পেমেন্টটি মুছে ফেলবেন?',saved:'সেভ হয়েছে।',backed:'ব্যাকআপ ডাউনলোড হয়েছে।',restored:'ব্যাকআপ রিস্টোর হয়েছে।',bad:'ব্যাকআপ ফাইলের ফরম্যাট ঠিক নেই।',unread:'ব্যাকআপ ফাইল পড়া যায়নি।',need:'পরিমাণ লিখুন।',lang:'English',mn:['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর']}};
let records=[],lang=localStorage.getItem('mosque_lang')||'bn',yearSel='all',editIdx=-1;
const $=id=>document.getElementById(id),dlg=$('dlg');
const t=k=>T[lang][k];
const nd=s=>lang==='bn'?String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):String(s);
const nf=n=>Number(n).toLocaleString(lang==='bn'?'bn-BD':'en-US',{maximumFractionDigits:2});
const taka=n=>'৳ '+nf(n);
function pm(m){const x=/^([A-Za-z]{3})-(\d{2})$/.exec(String(m||'').trim());const i=x?MS.findIndex(a=>a.toLowerCase()===x[1].toLowerCase()):-1;return x&&i>=0?{i,y:2000+ +x[2]}:null;}
const mlabel=m=>{const p=pm(m);return p?t('mn')[p.i]+' '+nd(p.y):(m||'-')};
const yearOf=m=>{const p=pm(m);return p?String(p.y):'-'};
const dlabel=d=>d?nd(d):'-';
function sortRecords(){
  const dt=r=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(r.date||'').trim());return m?Date.UTC(+m[3],+m[2]-1,+m[1]):Infinity;};
  const mk=r=>{const p=pm(r.month);return p?p.y*12+p.i:Infinity;};
  records.sort((a,b)=>{const p=mk(a),q=mk(b);if(p!==q)return p<q?-1:1;const x=dt(a),y=dt(b);return x===y?0:(x<y?-1:1);});
}
function load(){
  const s=localStorage.getItem(KEY);
  if(!localStorage.getItem('date_fixed_v3')){
    records=[...defaultData];
    localStorage.setItem('date_fixed_v3','1');
  } else {
    try{records=s?JSON.parse(s):[...defaultData];}catch(e){records=[...defaultData];}
  }
  if(!Array.isArray(records))records=[...defaultData];
  sortRecords();localStorage.setItem(KEY,JSON.stringify(records));
}
function save(){sortRecords();localStorage.setItem(KEY,JSON.stringify(records));toast(t('saved'));}
function render(){
  const years=[...new Set(records.map(r=>yearOf(r.month)))].sort();
  if(yearSel!=='all'&&!years.includes(yearSel))yearSel='all';
  $('chips').innerHTML=['all',...years].map(y=>`<button class="chip${y===yearSel?' on':''}" onclick="setYear('${y}')">${y==='all'?t('all'):nd(y)}</button>`).join('');
  const all=records.reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const paid=records.filter(r=>(parseFloat(r.amount)||0)>0);
  $('sTotal').textContent=taka(all);$('sCount').textContent=nf(paid.length);
  $('sLast').textContent=paid.length?mlabel(paid[paid.length-1].month):'-';
  const rows=records.map((r,i)=>({r,i})).filter(x=>yearSel==='all'||yearOf(x.r.month)===yearSel);
  const sum=rows.reduce((s,x)=>s+(parseFloat(x.r.amount)||0),0);
  $('ysum').innerHTML=`<b>${yearSel==='all'?t('all'):nd(yearSel)}</b><span>${nf(rows.length)} ${t('months')}</span>`;
  $('totLbl').textContent=t('total')+(yearSel==='all'?'':' · '+nd(yearSel));$('totAmt').textContent=taka(sum);
  $('list').innerHTML=rows.length?`<div class="head"><span>${t('th_month')}</span><span>${t('th_date')}</span><span>${t('th_amt')}</span><span></span></div>`+rows.map(({r,i})=>`<button class="row" onclick="openEdit(${i})"><span class="m">${esc(mlabel(r.month))}</span><span class="d">${esc(dlabel(r.date))}</span><span class="a">${taka(r.amount)}</span><span class="c">›</span></button>`).join(''):`<div class="empty">${t('empty')}</div>`;
}
function setYear(y){yearSel=y;render();}
function fillSel(){
  $('fM').innerHTML=t('mn').map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  let h='';for(let y=2015;y<=2040;y++)h+=`<option value="${y}">${nd(y)}</option>`;$('fY').innerHTML=h;
}
function iso(d){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(d||'').trim());return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';}
function openEdit(i){
  editIdx=i;fillSel();
  let p,d,a;
  if(i>=0){const r=records[i];p=pm(r.month)||{i:0,y:new Date().getFullYear()};d=iso(r.date);a=r.amount;}
  else{const last=records.filter(r=>pm(r.month)).pop();const lp=last?pm(last.month):null;
    p=lp?(lp.i===11?{i:0,y:lp.y+1}:{i:lp.i+1,y:lp.y}):{i:new Date().getMonth(),y:new Date().getFullYear()};
    d=new Date().toISOString().slice(0,10);a=last?last.amount:'';}
  $('fM').value=p.i;$('fY').value=p.y;$('fD').value=d;$('fA').value=a;
  $('dTitle').textContent=t(i>=0?'edit':'new');$('dDel').style.display=i>=0?'':'none';
  dlg.showModal();
}
function saveEdit(){
  const a=parseFloat($('fA').value);
  if(!(a>0)){toast(t('need'));$('fA').focus();return;}
  const m=MS[+$('fM').value]+'-'+String(+$('fY').value%100).padStart(2,'0');
  const v=$('fD').value;const date=v?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4):'';
  const rec={month:m,amount:a,date};
  if(editIdx>=0)records[editIdx]=rec;else records.push(rec);
  dlg.close();save();render();
}
function delEdit(){if(editIdx>=0&&confirm(t('confirm'))){records.splice(editIdx,1);dlg.close();save();render();}}
function exportBackup(){
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(records,null,2));
  a.download='Al_Nur_Jame_Mosque_payments_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();toast(t('backed'));
}
function importBackup(e){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){records=d;save();render();toast(t('restored'));}else alert(t('bad'));}catch(x){alert(t('unread'));}e.target.value='';};
  rd.readAsText(f);
}
let tt;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-t]').forEach(e=>{e.title=t(e.dataset.t);e.setAttribute('aria-label',t(e.dataset.t));});
  $('langBtn').textContent=t('lang');fillSel();setTimeout(fitBism,0);
}
function toggleLang(){lang=lang==='bn'?'en':'bn';localStorage.setItem('mosque_lang',lang);applyLang();render();}
function fitBism(){
  const el=document.querySelector('.bism');if(!el)return;
  el.style.fontSize='40px';
  const w=el.getBoundingClientRect().width||1;
  const avail=el.parentElement.clientWidth-(window.innerWidth<520?20:50);
  el.style.fontSize=Math.max(15,Math.min(26,avail/w*40))+'px';
}
window.addEventListener('resize',fitBism);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBism);
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
window.onload=()=>{load();applyLang();render();fitBism();};
</script>
</body>
</html>
